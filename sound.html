<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meeting Alert</title>
  <style>
    :root {
      --bg1: #031018;
      --bg2: #071f2d;
      --panel: rgba(7, 27, 36, 0.82);
      --line: rgba(105, 255, 210, 0.18);
      --glow: #7bffd8;
      --glow-strong: #98ffe4;
      --text: #d8fff6;
      --muted: #88cdbd;
      --danger: #ff6b57;
      --sweep-duration: 3.2s;
      --contact-phase: calc(var(--sweep-duration) * 0.074);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "SF Mono", "Monaco", "Inconsolata", "Fira Code", monospace;
      color: var(--text);
      background:
        radial-gradient(circle at center, rgba(30, 112, 106, 0.18) 0 18%, transparent 18% 100%),
        radial-gradient(circle at center, rgba(24, 66, 78, 0.75), rgba(2, 12, 19, 0.98) 68%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(120, 255, 219, 0.04) 0,
          rgba(120, 255, 219, 0.04) 1px,
          transparent 1px,
          transparent 4px
        );
      opacity: 0.45;
      mix-blend-mode: screen;
    }

    body::after {
      background: radial-gradient(circle at center, transparent 55%, rgba(0,0,0,0.42) 100%);
    }

    .sonar {
      position: absolute;
      width: min(88vw, 88vh);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(123, 255, 216, 0.12);
      box-shadow:
        0 0 0 1px rgba(123, 255, 216, 0.05),
        inset 0 0 45px rgba(78, 255, 207, 0.08),
        0 0 120px rgba(62, 255, 188, 0.08);
      background:
        radial-gradient(circle at center, rgba(116, 255, 221, 0.08) 0 10%, transparent 10% 100%),
        repeating-radial-gradient(circle at center, transparent 0 11%, rgba(123,255,216,0.1) 11.2%, transparent 11.8%),
        linear-gradient(to right, transparent 49.7%, rgba(123,255,216,0.16) 50%, transparent 50.3%),
        linear-gradient(to bottom, transparent 49.7%, rgba(123,255,216,0.16) 50%, transparent 50.3%);
      opacity: 0.9;
    }

    .sweep {
      position: absolute;
      width: min(88vw, 88vh);
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(125, 255, 224, 0.0) 0deg,
        rgba(125, 255, 224, 0.0) 320deg,
        rgba(125, 255, 224, 0.10) 342deg,
        rgba(125, 255, 224, 0.42) 354deg,
        rgba(125, 255, 224, 0.0) 360deg
      );
      filter: blur(2px);
      animation: rotateSweep var(--sweep-duration) linear infinite;
      opacity: 0.95;
    }

    .ping {
      position: absolute;
      width: 16px;
      height: 16px;
      left: 58%;
      top: 34%;
      border-radius: 50%;
      background: var(--glow-strong);
      box-shadow: 0 0 12px var(--glow), 0 0 28px rgba(123,255,216,0.65);
      opacity: 0;
      animation: contactBlip var(--sweep-duration) linear infinite;
      animation-delay: var(--contact-phase);
    }

    .ping::before,
    .ping::after {
      content: none;
    }

    .panel {
      position: relative;
      width: min(860px, 100%);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(8, 28, 35, 0.9), rgba(5, 18, 27, 0.84));
      box-shadow:
        inset 0 0 0 1px rgba(139,255,227,0.04),
        0 24px 80px rgba(0,0,0,0.45),
        0 0 40px rgba(62,255,188,0.08);
      border-radius: 18px;
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, transparent, rgba(127,255,225,0.05), transparent),
        repeating-linear-gradient(to right, transparent 0 39px, rgba(127,255,225,0.03) 39px 40px);
      pointer-events: none;
    }

    .hud {
      position: relative;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 12px;
    }

    .hud strong {
      color: var(--glow-strong);
      font-weight: 700;
    }

    .content {
      position: relative;
      padding: 34px 28px 28px;
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 26px;
      align-items: center;
    }

    .scope {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 1px solid rgba(123,255,216,0.22);
      position: relative;
      background:
        radial-gradient(circle at center, rgba(123,255,216,0.1) 0 8%, transparent 8% 100%),
        repeating-radial-gradient(circle at center, transparent 0 19%, rgba(123,255,216,0.14) 19.5%, transparent 20.5%),
        linear-gradient(to right, transparent 49.5%, rgba(123,255,216,0.18) 50%, transparent 50.5%),
        linear-gradient(to bottom, transparent 49.5%, rgba(123,255,216,0.18) 50%, transparent 50.5%);
      box-shadow: inset 0 0 28px rgba(89,255,206,0.08), 0 0 24px rgba(89,255,206,0.08);
      overflow: hidden;
    }

    .scope::before {
      content: "";
      position: absolute;
      inset: -18%;
      background: conic-gradient(from 0deg, transparent 0 320deg, rgba(123,255,216,0.42) 354deg, transparent 360deg);
      animation: rotateSweep var(--sweep-duration) linear infinite;
      opacity: 0.9;
    }

    .scope::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      left: 60%;
      top: 30%;
      border-radius: 50%;
      background: var(--glow-strong);
      box-shadow: 0 0 12px var(--glow), 0 0 28px rgba(123,255,216,0.65);
      opacity: 0;
      animation: contactBlip var(--sweep-duration) linear infinite;
      animation-delay: var(--contact-phase);
    }

    .text h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.03;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--glow-strong);
      text-shadow: 0 0 18px rgba(123,255,216,0.24);
      word-break: break-word;
    }

    .alert-line {
      margin: 0 0 12px;
      color: var(--danger);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      animation: alertFlash 1s steps(2) infinite;
    }

    .time {
      margin: 16px 0 0;
      font-size: 18px;
      color: var(--text);
      opacity: 0.92;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sub {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      max-width: 44ch;
    }

    .footer {
      position: relative;
      border-top: 1px solid var(--line);
      padding: 20px 24px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .status {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 12px;
    }

    .status strong {
      color: var(--glow-strong);
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 1px solid rgba(123,255,216,0.28);
      background: linear-gradient(180deg, rgba(19, 66, 69, 0.92), rgba(8, 36, 38, 0.92));
      color: var(--glow-strong);
      padding: 14px 22px;
      font: inherit;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 24px rgba(68,255,196,0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(123,255,216,0.5);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 0 28px rgba(68,255,196,0.16);
    }

    button#dismiss {
      color: #d8f6ef;
      background: linear-gradient(180deg, rgba(42, 58, 67, 0.88), rgba(20, 29, 34, 0.9));
    }

    @keyframes rotateSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes contactBlip {
      0% {
        opacity: 1;
        transform: scale(1);
        filter: brightness(1.3);
      }
      42% {
        opacity: 0;
        transform: scale(0.82);
        filter: brightness(0.9);
      }
      100% {
        opacity: 0;
        transform: scale(0.82);
        filter: brightness(0.9);
      }
    }

    @keyframes alertFlash {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.45; }
    }

    @media (max-width: 720px) {
      .content {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }

      .sub { margin-left: auto; margin-right: auto; }
      .footer { justify-content: center; }
      .status { text-align: center; }
    }
  </style>
</head>
<body>
  <div class="sonar"></div>
  <div class="sweep"></div>
  <div class="ping"></div>

  <main class="panel">
    <div class="hud">
      <div>Vessel: <strong>SB-01</strong></div>
      <div>Station: <strong>Seas Command</strong></div>
      <div>Mode: <strong>Meeting Intercept</strong></div>
    </div>

    <section class="content">
      <div class="scope" aria-hidden="true"></div>

      <div class="text">
        <p class="alert-line">Incoming Contact Detected</p>
        <h1 id="title">Meeting starting soon</h1>
        <p class="time" id="time"></p>
        <p class="sub">Active sonar contact acquired. Bridge requests immediate attention. Join channel or dismiss alarm.</p>
      </div>
    </section>

    <div class="footer">
      <div class="status">Threat level: <strong>Elevated</strong> · Audio beacon: <strong>Active</strong></div>
      <div class="buttons">
        <button id="join" style="display:none;">Join Channel</button>
        <button id="dismiss">Silence Alarm</button>
      </div>
    </div>
  </main>

  <script src="sound.js"></script>
</body>
</html>
